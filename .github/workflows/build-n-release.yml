name: "Build and test"

# No release/coverage jobs: backend-functions consumes this fork by git commit pin (not npm), the
# npm name belongs to upstream (jblew) and the fork has no NPM_TOKEN; the deprecated codecov npm
# uploader crashes. Coverage is still generated (coverage/lcov.info) by the 22/24 test legs.

on:
  push:
    branches: [master]

jobs:
  build_test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: true
      matrix:
        # 16 = engines floor in package.json (consumer support); 22/24 = patched LTS lines.
        nodejs: [16, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodejs }}
          check-latest: true
      
      # firebase-tools (emulators) requires Node >= 20, so the Node 16 floor leg runs unit tests only.
      # The Firestore/Database emulators also hard-fail on Java < 21 (MIN_SUPPORTED_JAVA_MAJOR_VERSION).
      - if: matrix.nodejs != 16
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - if: matrix.nodejs != 16
        run: scripts/setup-firebase-emulator-for-tests.sh
      
      - run: npm ci
      
      - run: npm run build
      
      - if: matrix.nodejs == 16
        run: npm test
      
      - if: matrix.nodejs != 16
        run: npm run testall-with-coverage-lcov
