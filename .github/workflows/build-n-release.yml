name: "Build and release"

on:
  push:
    branches: [master]

jobs:
  build_test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: true
      matrix:
        # 16 = engines floor in package.json (consumer support); 22/24 = patched LTS lines.
        nodejs: [16, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodejs }}
          check-latest: true
      
      - run: scripts/setup-firebase-emulator-for-tests.sh
      
      - run: npm ci
      
      - run: npm run build
      
      - run: npm run testall-with-coverage-lcov
      
      - run: npm run upload-coverage
      
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build_test]
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # semantic-release needs full history/tags and authenticates with GITHUB_TOKEN itself.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
            
      - run: npm ci
      - run: npm run build      
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}